<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>待办日历 · FlexNote</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2316a34a' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='4' width='18' height='18' rx='2'/%3E%3Cpath d='M16 2v4M8 2v4M3 10h18'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
  :root{
    --bg:#faf9f7; --card:#ffffff; --bd:#e7e5e4; --bd-l:#f0efed;
    --t1:#1c1917; --t2:#44403c; --t3:#78716c; --t4:#a8a29e;
    --green:#16a34a; --green-d:#15803d; --red:#dc2626;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--t2);
    font-family:"Plus Jakarta Sans","Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  .page{max-width:1180px;margin:0 auto;padding:28px 20px 60px;}

  .layout{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start;}

  /* ===== 日历卡片 ===== */
  .cal-card{background:#fff;border:1px solid var(--bd);border-radius:14px;overflow:hidden;}
  .cal-head{display:flex;align-items:center;gap:14px;padding:18px 22px;border-bottom:1px solid var(--bd-l);}
  .cal-title .ym{font-size:19px;font-weight:800;color:var(--t1);letter-spacing:-.01em;}
  .cal-title .lm{font-size:12px;color:var(--t4);margin-top:1px;}
  .nav{margin-left:auto;display:flex;align-items:center;gap:6px;}
  .nav-btn{width:32px;height:32px;border:1px solid var(--bd);background:#fff;border-radius:8px;color:var(--t3);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;}
  .nav-btn:hover{background:#faf9f7;border-color:#d6d3d1;color:var(--t1);}
  .nav-btn:disabled{opacity:.4;cursor:not-allowed;}
  .today-btn{height:32px;padding:0 14px;border:none;background:var(--green);color:#fff;font-size:13px;font-weight:600;font-family:inherit;border-radius:8px;cursor:pointer;transition:background .15s;}
  .today-btn:hover{background:var(--green-d);}

  .weekdays{display:grid;grid-template-columns:repeat(7,1fr);padding:10px 14px 0;}
  .weekdays span{text-align:center;font-size:12.5px;font-weight:600;color:var(--t3);padding:6px 0;}
  .weekdays span.we{color:var(--red);}

  .days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:6px 14px 14px;}
  .day{
    position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    height:74px;border-radius:10px;cursor:pointer;border:1.5px solid transparent;transition:background .12s;
  }
  .day:hover{background:#f5f5f4;}
  .day .d{font-size:15.5px;font-weight:600;color:var(--t1);line-height:1;}
  .day .l{font-size:10.5px;color:var(--t4);line-height:1;}
  .day.other{opacity:.5;}
  .day.other .d,.day.other .l{color:var(--t4);}
  .day.festival .l{color:var(--red);font-weight:600;}
  .day.selected{background:#f0fdf4;}
  .day.selected:hover{background:#dcfce7;}
  .day.today{border-color:var(--green);}
  .day.today .d{color:var(--green);}
  .day.today.selected{background:#f0fdf4;}
  .day .mark{position:absolute;top:7px;right:8px;width:5px;height:5px;border-radius:50%;background:var(--green);}
  .day .mark.done{background:#cbd5e1;}

  /* ===== 右侧 ===== */
  .side{display:flex;flex-direction:column;gap:16px;}
  .date-bar{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:14px 18px;}
  .date-bar .dm{font-size:15px;font-weight:800;color:#15803d;}
  .date-bar .ds{font-size:12px;color:#16a34a;margin-top:2px;opacity:.85;}

  .todo-card{background:#fff;border:1px solid var(--bd);border-radius:14px;overflow:hidden;}
  .todo-head{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--bd-l);}
  .todo-head .ti{width:28px;height:28px;border-radius:50%;background:#f0fdf4;color:var(--green);display:flex;align-items:center;justify-content:center;}
  .todo-head .tt{font-size:14.5px;font-weight:800;color:var(--t1);}
  .todo-head .tc{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--t3);background:#f5f5f4;border-radius:20px;padding:2px 10px;}
  .todo-head .tc.zero{color:var(--t4);}

  .add-row{display:flex;gap:8px;padding:14px 16px 8px;}
  .add-row input{flex:1;height:36px;border:1px solid var(--bd);border-radius:8px;padding:0 12px;font-size:13px;font-family:inherit;color:var(--t1);outline:none;transition:border-color .15s,box-shadow .15s;}
  .add-row input::placeholder{color:var(--t4);}
  .add-row input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(22,163,74,.12);}
  .add-btn{height:36px;padding:0 16px;border:none;background:var(--green);color:#fff;font-size:13px;font-weight:600;font-family:inherit;border-radius:8px;cursor:pointer;transition:background .15s;}
  .add-btn:hover{background:var(--green-d);}

  .todo-list{padding:6px 12px 14px;max-height:380px;overflow-y:auto;}
  .todo-item{display:flex;align-items:center;gap:10px;padding:7px 6px;border-radius:8px;transition:background .12s;}
  .todo-item:hover{background:#faf9f7;}
  .cb{width:19px;height:19px;border-radius:50%;border:1.5px solid #d6d3d1;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;background:#fff;}
  .cb:hover{border-color:var(--green);}
  .cb.checked{background:var(--green);border-color:var(--green);color:#fff;}
  .todo-text{flex:1;font-size:13.5px;color:var(--t2);word-break:break-all;}
  .todo-item.done .todo-text{color:var(--t4);text-decoration:line-through;}
  .del{opacity:0;width:26px;height:26px;border:none;background:transparent;color:var(--t4);border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;}
  .todo-item:hover .del{opacity:1;}
  .del:hover{background:#fee2e2;color:var(--red);}

  .empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:30px 20px 34px;}
  .empty .ei{width:46px;height:46px;border-radius:50%;background:#f5f5f4;color:var(--t4);display:flex;align-items:center;justify-content:center;}
  .empty p{font-size:13px;color:var(--t4);}

  .toast-wrap{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:100;pointer-events:none;}
  .toast{display:flex;align-items:center;gap:9px;background:#1c1917;color:#fff;font-size:13.5px;font-weight:500;padding:11px 16px;border-radius:10px;box-shadow:0 10px 30px rgba(28,25,23,.28);opacity:0;transform:translateY(12px);transition:opacity .25s,transform .25s;}
  .toast.show{opacity:1;transform:translateY(0);}

  @media (max-width:920px){
    .layout{grid-template-columns:1fr;}
    .side{order:2;}
  }
  @media (max-width:520px){
    .day{height:58px;}
    .cal-head{flex-wrap:wrap;}
    .nav{margin-left:auto;}
    .page{padding:16px 12px 50px;}
  }
</style>
</head>
<body>
  <div class="page">
    <div class="layout">
      <!-- 日历卡片 -->
      <section class="cal-card">
        <header class="cal-head">
          <div class="cal-title">
            <div class="ym" id="ym">2026年9月</div>
            <div class="lm" id="lm">农历八月</div>
          </div>
          <div class="nav">
            <button class="nav-btn" id="prevYear" title="上一年">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m11 17-5-5 5-5"/><path d="m18 17-5-5 5-5"/></svg>
            </button>
            <button class="nav-btn" id="prevMonth" title="上个月">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <button class="today-btn" id="todayBtn">今天</button>
            <button class="nav-btn" id="nextMonth" title="下个月">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
            </button>
            <button class="nav-btn" id="nextYear" title="下一年">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 17 5-5-5-5"/><path d="m13 17 5-5-5-5"/></svg>
            </button>
          </div>
        </header>
        <div class="weekdays">
          <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span>
          <span class="we">六</span><span class="we">日</span>
        </div>
        <div class="days" id="days"></div>
      </section>

      <!-- 右侧 -->
      <aside class="side">
        <div class="date-bar">
          <div class="dm" id="dateMain">9月29日 周二</div>
          <div class="ds" id="dateSub">农历八月十九</div>
        </div>
        <div class="todo-card">
          <header class="todo-head">
            <span class="ti">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>
            </span>
            <span class="tt" id="todoTitle">9月29日的待办</span>
            <span class="tc" id="todoCount">3</span>
          </header>
          <div class="add-row">
            <input id="todoInput" placeholder="输入待办，回车添加" maxlength="80">
            <button class="add-btn" id="addBtn">添加</button>
          </div>
          <div class="todo-list" id="todoList"></div>
        </div>
      </aside>
    </div>
  </div>

  <div class="toast-wrap" id="toastWrap"></div>
<script>
  // 农历（格子小字）
  const LUNAR = {
    "2026-8-31":"十九",
    "2026-9-1":"二十","2026-9-2":"廿一","2026-9-3":"廿二","2026-9-4":"廿三","2026-9-5":"廿四","2026-9-6":"廿五",
    "2026-9-7":"廿六","2026-9-8":"廿七","2026-9-9":"廿八","2026-9-10":"教师节","2026-9-11":"八月","2026-9-12":"初二","2026-9-13":"初三",
    "2026-9-14":"初四","2026-9-15":"初五","2026-9-16":"初六","2026-9-17":"初七","2026-9-18":"初八","2026-9-19":"初九","2026-9-20":"初十",
    "2026-9-21":"十一","2026-9-22":"十二","2026-9-23":"十三","2026-9-24":"十四","2026-9-25":"中秋节","2026-9-26":"十六","2026-9-27":"十七",
    "2026-9-28":"十八","2026-9-29":"十九","2026-9-30":"二十",
    "2026-10-1":"国庆节","2026-10-2":"廿二","2026-10-3":"廿三","2026-10-4":"廿四"
  };
  // 农历完整文本（右侧）
  const LSUB = {
    "2026-8-31":"农历七月十九",
    "2026-9-1":"农历七月二十","2026-9-2":"农历七月廿一","2026-9-3":"农历七月廿二","2026-9-4":"农历七月廿三","2026-9-5":"农历七月廿四","2026-9-6":"农历七月廿五",
    "2026-9-7":"农历七月廿六","2026-9-8":"农历七月廿七","2026-9-9":"农历七月廿八","2026-9-10":"农历七月廿九","2026-9-11":"农历八月初一","2026-9-12":"农历八月初二","2026-9-13":"农历八月初三",
    "2026-9-14":"农历八月初四","2026-9-15":"农历八月初五","2026-9-16":"农历八月初六","2026-9-17":"农历八月初七","2026-9-18":"农历八月初八","2026-9-19":"农历八月初九","2026-9-20":"农历八月初十",
    "2026-9-21":"农历八月十一","2026-9-22":"农历八月十二","2026-9-23":"农历八月十三","2026-9-24":"农历八月十四","2026-9-25":"农历八月十五","2026-9-26":"农历八月十六","2026-9-27":"农历八月十七",
    "2026-9-28":"农历八月十八","2026-9-29":"农历八月十九","2026-9-30":"农历八月二十",
    "2026-10-1":"农历八月廿一","2026-10-2":"农历八月廿二","2026-10-3":"农历八月廿三","2026-10-4":"农历八月廿四"
  };
  const LMONTH = { "2026-9":"农历八月" };
  const FEST = new Set(["教师节","中秋节","国庆节"]);

  // 待办
  const TODOS = {
    "2026-9-29":[
      {id:1,text:"完成 Vessel 日历模块",done:false},
      {id:2,text:"回复产品邮件",done:false},
      {id:3,text:"晨间笔记",done:true}
    ],
    "2026-9-25":[{id:4,text:"中秋回家吃饭",done:true}],
    "2026-9-10":[{id:5,text:"给老师发祝福",done:true}]
  };

  const today = {y:2026,m:9,d:29};
  let viewYear = 2026, viewMonth = 9;
  let selected = {y:2026,m:9,d:29};

  const daysEl = document.getElementById("days");
  const ym = document.getElementById("ym");
  const lm = document.getElementById("lm");
  const dateMain = document.getElementById("dateMain");
  const dateSub = document.getElementById("dateSub");
  const todoTitle = document.getElementById("todoTitle");
  const todoCount = document.getElementById("todoCount");
  const todoList = document.getElementById("todoList");
  const todoInput = document.getElementById("todoInput");

  const sameDay = (a,b)=>a.y===b.y&&a.m===b.m&&a.d===b.d;
  const selKey = ()=>`${selected.y}-${selected.m}-${selected.d}`;
  function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
  const prevYM = (y,m)=>m===1?{y:y-1,m:12}:{y:y,m:m-1};
  const nextYM = (y,m)=>m===12?{y:y+1,m:1}:{y:y,m:m+1};

  function cellHtml(c){
    const key = `${c.y}-${c.m}-${c.d}`;
    const lt = LUNAR[key] || "";
    const isFest = FEST.has(lt);
    const list = TODOS[key];
    const hasTodo = list && list.length>0;
    const allDone = hasTodo && list.every(t=>t.done);
    const cls = ["day", c.other&&"other", isFest&&"festival",
      sameDay(c,selected)&&"selected", sameDay(c,today)&&"today"].filter(Boolean).join(" ");
    const mark = hasTodo ? `<span class="mark ${allDone?"done":""}"></span>` : "";
    return `<div class="${cls}" data-key="${key}">
      <span class="d">${c.d}</span><span class="l">${lt||"&nbsp;"}</span>${mark}</div>`;
  }

  function renderCalendar(){
    ym.textContent = `${viewYear}年${viewMonth}月`;
    lm.textContent = LMONTH[`${viewYear}-${viewMonth}`] || "";
    const lead = (new Date(viewYear,viewMonth-1,1).getDay()+6)%7;
    const dim = new Date(viewYear,viewMonth,0).getDate();
    const dimp = new Date(viewYear,viewMonth-1,0).getDate();
    const p = prevYM(viewYear,viewMonth), n = nextYM(viewYear,viewMonth);
    const cells = [];
    for(let i=lead-1;i>=0;i--) cells.push({y:p.y,m:p.m,d:dimp-i,other:true});
    for(let d=1;d<=dim;d++) cells.push({y:viewYear,m:viewMonth,d});
    const target = Math.ceil((lead+dim)/7)*7;
    let nd=1;
    while(cells.length<target) cells.push({y:n.y,m:n.m,d:nd++,other:true});
    daysEl.innerHTML = cells.map(cellHtml).join("");
  }

  function renderTodoList(list){
    if(!list.length){
      todoList.innerHTML = `<div class="empty">
        <span class="ei"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></span>
        <p>这一天还没有待办</p></div>`;
      return;
    }
    todoList.innerHTML = list.map(t=>`
      <div class="todo-item ${t.done?"done":""}" data-id="${t.id}">
        <span class="cb ${t.done?"checked":""}">
          ${t.done?'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>':""}
        </span>
        <span class="todo-text">${escapeHtml(t.text)}</span>
        <button class="del" title="删除">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
        </button>
      </div>`).join("");
  }

  function renderSide(){
    const key = selKey();
    const wd = ["周日","周一","周二","周三","周四","周五","周六"][new Date(selected.y,selected.m-1,selected.d).getDay()];
    dateMain.textContent = `${selected.m}月${selected.d}日 ${wd}`;
    const base = LSUB[key] || "";
    const lt = LUNAR[key];
    dateSub.textContent = FEST.has(lt) ? `${base} · ${lt}` : base;
    todoTitle.textContent = `${selected.m}月${selected.d}日的待办`;
    const list = TODOS[key] || [];
    todoCount.textContent = list.length;
    todoCount.className = "tc" + (list.length===0?" zero":"");
    renderTodoList(list);
  }

  // 点击日期
  daysEl.addEventListener("click",e=>{
    const el = e.target.closest(".day"); if(!el) return;
    const [y,m,d] = el.dataset.key.split("-").map(Number);
    selected = {y,m,d};
    if(m!==viewMonth||y!==viewYear){viewYear=y;viewMonth=m;}
    renderCalendar(); renderSide();
  });

  // 勾选 / 删除
  todoList.addEventListener("click",e=>{
    const cbEl = e.target.closest(".cb");
    const delEl = e.target.closest(".del");
    const key = selKey();
    if(cbEl){
      const id = Number(cbEl.closest(".todo-item").dataset.id);
      const t = TODOS[key].find(x=>x.id===id);
      t.done = !t.done;
      renderSide(); renderCalendar();
      if(t.done) toastShow("已完成一项待办");
    } else if(delEl){
      const id = Number(delEl.closest(".todo-item").dataset.id);
      TODOS[key] = TODOS[key].filter(x=>x.id!==id);
      renderSide(); renderCalendar();
      toastShow("待办已删除");
    }
  });

  // 添加
  function addTodo(){
    const val = todoInput.value.trim();
    if(!val){toastShow("请输入待办内容");return;}
    const key = selKey();
    if(!TODOS[key]) TODOS[key]=[];
    TODOS[key].push({id:Date.now(),text:val,done:false});
    todoInput.value="";
    renderSide(); renderCalendar();
    toastShow("待办已添加");
  }
  document.getElementById("addBtn").addEventListener("click",addTodo);
  todoInput.addEventListener("keydown",e=>{if(e.key==="Enter")addTodo();});

  // 导航
  const go = (y,m)=>{viewYear=y;viewMonth=m;renderCalendar();};
  document.getElementById("prevMonth").addEventListener("click",()=>{const p=prevYM(viewYear,viewMonth);go(p.y,p.m);});
  document.getElementById("nextMonth").addEventListener("click",()=>{const n=nextYM(viewYear,viewMonth);go(n.y,n.m);});
  document.getElementById("prevYear").addEventListener("click",()=>go(viewYear-1,viewMonth));
  document.getElementById("nextYear").addEventListener("click",()=>go(viewYear+1,viewMonth));
  document.getElementById("todayBtn").addEventListener("click",()=>{
    viewYear=today.y;viewMonth=today.m;selected={...today};
    renderCalendar();renderSide();toastShow("已回到今天");
  });

  renderCalendar(); renderSide();

  // Toast
  const toastWrap = document.getElementById("toastWrap");
  let toastTimer;
  function toastShow(msg){
    const el = document.createElement("div");
    el.className = "toast";
    el.innerHTML = `<span style="color:var(--green);display:flex;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>${msg}`;
    toastWrap.appendChild(el);
    requestAnimationFrame(()=>el.classList.add("show"));
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>{el.classList.remove("show");setTimeout(()=>el.remove(),260);},2000);
  }
</script>
</body>
</html>
