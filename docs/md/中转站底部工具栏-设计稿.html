<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中转站底部工具栏 - 设计稿</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Plus Jakarta Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f0eeea;
    color: #1c1917;
    min-height: 100vh;
    padding: 40px 24px;
  }

  .page-title {
    text-align: center;
    font-size: 15px;
    font-weight: 700;
    color: #57534e;
    margin-bottom: 6px;
  }
  .page-subtitle {
    text-align: center;
    font-size: 12px;
    color: #a8a29e;
    margin-bottom: 34px;
  }

  /* ===== 停靠面板容器 ===== */
  .dock-wrap {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    justify-content: flex-end;
  }
  .dock-panel {
    width: 420px;
    background: #fff;
    border: 1px solid #e7e5e4;
    border-radius: 12px;
    box-shadow: 0 12px 40px rgba(28,25,23,0.12);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* 面板头部 */
  .dock-header {
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    border-bottom: 1px solid #f0efed;
    background: #fff;
  }
  .dock-header-left {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    color: #1c1917;
  }
  .dock-header-left .favicon {
    width: 22px; height: 22px;
    border-radius: 6px;
    background: #f0fdf4;
    display: flex; align-items: center; justify-content: center;
    color: #16a34a;
  }
  .dock-header-actions {
    display: flex;
    align-items: center;
    gap: 2px;
  }
  .icon-btn {
    width: 30px; height: 30px;
    border-radius: 6px;
    border: none;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #78716c;
    cursor: pointer;
    transition: background 0.12s, color 0.12s;
  }
  .icon-btn:hover { background: #f5f5f4; color: #1c1917; }
  .icon-btn.close:hover { background: #fef2f2; color: #dc2626; }
  .icon-btn svg { width: 16px; height: 16px; }

  /* 面板内容（模拟） */
  .dock-body {
    height: 220px;
    background:
      linear-gradient(#faf9f7,#faf9f7);
    background-size: 100% 100%;
    padding: 20px;
    position: relative;
    overflow: hidden;
  }
  .mock-line {
    height: 10px;
    background: #eceae7;
    border-radius: 5px;
    margin-bottom: 12px;
  }
  .mock-line.w90 { width: 90%; }
  .mock-line.w70 { width: 70%; }
  .mock-line.w80 { width: 80%; }
  .mock-line.w50 { width: 50%; }
  .mock-block {
    height: 70px;
    background: #f0efed;
    border-radius: 8px;
    margin-top: 18px;
  }

  /* ===== 底部工具栏 ===== */
  .dock-footer {
    height: 46px;
    border-top: 1px solid #e7e5e4;
    background: #faf9f7;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 10px;
  }
  .footer-left {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }
  .footer-title {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    color: #44403c;
    max-width: 180px;
    padding: 6px 8px;
    border-radius: 6px;
    white-space: nowrap;
  }
  .footer-title svg { width: 13px; height: 13px; color: #16a34a; flex-shrink: 0; }
  .footer-title .title-text {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .footer-right {
    display: flex;
    align-items: center;
    gap: 2px;
  }
  /* 操作按钮带 tooltip 提示 */
  .tool-btn {
    width: 32px; height: 32px;
    border-radius: 7px;
    border: none;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #57534e;
    cursor: pointer;
    transition: background 0.12s, color 0.12s;
    position: relative;
  }
  .tool-btn:hover { background: #e7e5e4; color: #1c1917; }
  .tool-btn svg { width: 16px; height: 16px; }

  .tool-btn.danger:hover { background: #fef2f2; color: #dc2626; }

  /* 分隔线 */
  .footer-divider {
    width: 1px;
    height: 18px;
    background: #e0dedb;
    margin: 0 4px;
  }

  /* 停靠位置按钮（带下拉） */
  .dock-position-btn {
    gap: 4px;
    width: auto;
    padding: 0 7px;
  }
  .dock-position-btn .chevron {
    width: 11px; height: 11px;
  }

  /* ===== 停靠位置弹出菜单 ===== */
  .popover {
    position: absolute;
    bottom: 54px;
    right: 10px;
    width: 172px;
    background: #fff;
    border: 1px solid #e7e5e4;
    border-radius: 10px;
    box-shadow: 0 8px 30px rgba(28,25,23,0.14);
    padding: 5px;
    z-index: 30;
  }
  .popover-title {
    font-size: 11px;
    font-weight: 600;
    color: #a8a29e;
    padding: 5px 8px 7px;
  }
  .popover-item {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 7px 8px;
    border-radius: 6px;
    font-size: 12.5px;
    color: #44403c;
    cursor: pointer;
    border: none;
    background: transparent;
    width: 100%;
    text-align: left;
  }
  .popover-item:hover { background: #f5f5f4; }
  .popover-item.active {
    background: #f0fdf4;
    color: #15803d;
    font-weight: 600;
  }
  .popover-item svg { width: 15px; height: 15px; }
  .popover-item .check {
    margin-left: auto;
    width: 14px; height: 14px;
  }

  /* 深色变体 */
  .dock-panel.dark .dock-header,
  .dock-panel.dark .dock-footer {
    background: #1c1917;
    border-color: #292524;
  }
  .dock-panel.dark .dock-header-left { color: #fafaf9; }
  .dock-panel.dark .dock-body { background: #211e1b; }
  .dock-panel.dark .mock-line { background: #2f2c28; }
  .dock-panel.dark .mock-block { background: #2a2723; }
  .dock-panel.dark .footer-title { color: #d6d3d1; }
  .dock-panel.dark .tool-btn { color: #a8a29e; }
  .dock-panel.dark .tool-btn:hover { background: #292524; color: #fafaf9; }
  .dock-panel.dark .footer-divider { background: #332f2b; }
  .dock-panel.dark .dock-position-btn .chevron { color: #78716c; }
  .dock-panel.dark .popover {
    background: #26221f;
    border-color: #38342f;
  }
  .dock-panel.dark .popover-item { color: #d6d3d1; }
  .dock-panel.dark .popover-item:hover { background: #2f2c28; }
  .dock-panel.dark .popover-item.active { background: #14532d; color: #4ade80; }

  .demo-section {
    max-width: 1100px;
    margin: 44px auto 0;
  }
  .demo-section-title {
    font-size: 12px;
    font-weight: 700;
    color: #a8a29e;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 14px;
  }
  .demo-section .dock-wrap { justify-content: flex-start; }

  .design-note {
    max-width: 760px;
    margin: 36px auto 0;
    font-size: 11.5px;
    color: #a8a29e;
    text-align: center;
    line-height: 1.9;
  }
</style>

<div class="design-note">

</div>

<script>
  // 停靠位置弹出菜单
  const btn = document.getElementById('dockPosBtn');
  const popover = document.getElementById('dockPopover');
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    popover.style.display = popover.style.display === 'none' ? 'block' : 'none';
  });
  document.addEventListener('click', () => { popover.style.display = 'none'; });

  // 选择停靠位置
  popover.querySelectorAll('.popover-item').forEach(item => {
    item.addEventListener('click', (e) => {
      e.stopPropagation();
      popover.querySelectorAll('.popover-item').forEach(i => {
        i.classList.remove('active');
        const old = i.querySelector('.check');
        if (old) old.remove();
      });
      item.classList.add('active');
      if (!item.querySelector('.check')) {
        const check = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        check.setAttribute('class','check');
        check.setAttribute('viewBox','0 0 24 24');
        check.setAttribute('fill','none');
        check.setAttribute('stroke','currentColor');
        check.setAttribute('stroke-width','3');
        check.setAttribute('stroke-linecap','round');
        check.setAttribute('stroke-linejoin','round');
        check.innerHTML = '<path d="M20 6 9 17l-5-5"/>';
        item.appendChild(check);
      }
      popover.style.display = 'none';
    });
  });
</script>
