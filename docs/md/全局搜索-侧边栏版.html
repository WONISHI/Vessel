<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全局搜索 - 侧边栏版</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2316a34a' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='11' cy='11' r='8'/%3E%3Cpath d='m21 21-4.3-4.3'/%3E%3C/svg%3E">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f3f2ef;
    color: #1c1917;
    min-height: 100vh;
  }
  svg { display: block; }
  button, input { font-family: inherit; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  .window {
    max-width: 1320px;
    margin: 28px auto;
    background: #faf9f7;
    border: 1px solid #e7e5e4;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(28,25,23,.08);
    display: flex;
    flex-direction: column;
  }
  .body-row { display: flex; min-height: 720px; }

  /* ===== 活动栏 ===== */
  .activity {
    width: 52px;
    background: #f6f5f3;
    border-right: 1px solid #eceae7;
    display: flex; flex-direction: column; align-items: center;
    padding: 10px 0; gap: 4px;
  }
  .activity .spacer { flex: 1; }
  .act-btn {
    width: 38px; height: 38px;
    display: flex; align-items: center; justify-content: center;
    border: none; border-radius: 9px;
    background: transparent; color: #a8a29e;
    cursor: pointer; position: relative;
    transition: background .13s, color .13s;
  }
  .act-btn svg { width: 20px; height: 20px; }
  .act-btn:hover { background: #edece9; color: #57534e; }
  .act-btn.active { color: #16a34a; background: #f0fdf4; }
  .act-btn.active::before {
    content: ""; position: absolute; left: -7px;
    width: 3px; height: 20px; border-radius: 2px;
    background: #16a34a;
  }

  /* ===== 搜索侧边栏（固定宽度） ===== */
  .search-sidebar {
    width: 320px;
    flex-shrink: 0;
    background: #faf9f7;
    border-right: 1px solid #eceae7;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .side-header {
    height: 44px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 14px;
  }
  .side-header .side-title { font-size: 12px; font-weight: 700; color: #78716c; letter-spacing: .3px; }
  .side-header .collapse-btn {
    width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    border: none; border-radius: 6px; background: transparent; color: #a8a29e;
    cursor: pointer;
  }
  .side-header .collapse-btn svg { width: 15px; height: 15px; }
  .side-header .collapse-btn:hover { background: #edece9; color: #57534e; }

  /* ===== 项目选择器（搜索范围） ===== */
  .project-wrap { position: relative; margin: 0 12px 10px; }
  .project-btn {
    width: 100%;
    height: 36px;
    display: flex; align-items: center; gap: 8px;
    padding: 0 9px;
    background: #fff;
    border: 1.5px solid #e7e5e4;
    border-radius: 9px;
    cursor: pointer;
    color: #1c1917;
    transition: border-color .13s, box-shadow .13s;
  }
  .project-btn:hover { border-color: #d6d3d1; }
  .project-btn.open { border-color: #16a34a; box-shadow: 0 0 0 3px #f0fdf4; }
  .project-btn .pb-folder { width: 15px; height: 15px; color: #16a34a; flex-shrink: 0; }
  .project-btn .pb-body { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; line-height: 1.15; }
  .project-btn .pb-name { font-size: 12.5px; font-weight: 600; white-space: nowrap; }
  .project-btn .pb-path { font-size: 10px; color: #a8a29e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .project-btn .pb-chev { width: 15px; height: 15px; color: #a8a29e; flex-shrink: 0; transition: transform .16s; }
  .project-btn.open .pb-chev { transform: rotate(180deg); }

  /* 项目下拉 */
  .project-menu {
    position: absolute;
    top: calc(100% + 6px); left: 0; right: 0;
    background: #fff;
    border: 1px solid #eceae7;
    border-radius: 10px;
    box-shadow: 0 12px 32px rgba(28,25,23,.14);
    padding: 5px;
    z-index: 40;
    display: none;
    max-height: 280px;
    overflow-y: auto;
  }
  .project-menu.show { display: block; }
  .pm-label { font-size: 10.5px; color: #a8a29e; font-weight: 600; padding: 6px 8px 4px; }
  .pm-item {
    display: flex; align-items: center; gap: 9px;
    padding: 7px 8px; border-radius: 7px;
    cursor: pointer;
  }
  .pm-item:hover { background: #f5f5f4; }
  .pm-item .pm-folder { width: 15px; height: 15px; color: #a8a29e; flex-shrink: 0; }
  .pm-item.active .pm-folder { color: #16a34a; }
  .pm-item .pm-body { flex: 1; min-width: 0; line-height: 1.2; }
  .pm-item .pm-name { font-size: 12.5px; font-weight: 500; color: #44403c; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pm-item.active .pm-name { color: #15803d; font-weight: 600; }
  .pm-item .pm-path { font-size: 10px; color: #a8a29e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pm-item .pm-check { width: 14px; height: 14px; color: #16a34a; flex-shrink: 0; opacity: 0; }
  .pm-item.active .pm-check { opacity: 1; }
  .pm-sep { height: 1px; background: #f0efed; margin: 5px 4px; }
  .pm-action {
    display: flex; align-items: center; gap: 9px;
    padding: 7px 8px; border-radius: 7px; cursor: pointer;
    font-size: 12.5px; color: #57534e;
  }
  .pm-action:hover { background: #f5f5f4; }
  .pm-action svg { width: 15px; height: 15px; color: #a8a29e; flex-shrink: 0; }


  /* 侧边栏搜索框 */
  .side-search {
    margin: 0 12px 8px;
    display: flex; align-items: center; gap: 6px;
    height: 36px;
    padding: 0 8px;
    background: #fff;
    border: 1.5px solid #e7e5e4;
    border-radius: 9px;
    transition: border-color .13s, box-shadow .13s;
  }
  .side-search:focus-within { border-color: #16a34a; box-shadow: 0 0 0 3px #f0fdf4; }
  .side-search > svg { width: 15px; height: 15px; color: #a8a29e; flex-shrink: 0; }
  .side-search input { flex: 1; border: none; outline: none; font-size: 13px; min-width: 0; background: transparent; color: #1c1917; }
  .side-search input::placeholder { color: #c4c0bb; }
  .mini-toggle {
    width: 24px; height: 24px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    border: none; border-radius: 6px;
    background: transparent; color: #a8a29e;
    cursor: pointer;
  }
  .mini-toggle svg { width: 13px; height: 13px; }
  .mini-toggle:hover { background: #f5f5f4; color: #57534e; }
  .mini-toggle.active { background: #dcfce7; color: #15803d; }
  .mini-divider { width: 1px; height: 16px; background: #e7e5e4; flex-shrink: 0; }

  /* 过滤行（内容）—— 与搜索框同高、同圆角、同图标尺寸 */
  .side-filters { margin: 0 12px 8px; display: flex; flex-direction: column; gap: 8px; }
  .side-filter {
    display: flex; align-items: center; gap: 8px;
    height: 36px; padding: 0 9px;
    background: #fff; border: 1.5px solid #e7e5e4; border-radius: 9px;
    transition: border-color .13s, box-shadow .13s;
  }
  .side-filter:focus-within { border-color: #16a34a; box-shadow: 0 0 0 3px #f0fdf4; }
  .side-filter svg { width: 15px; height: 15px; flex-shrink: 0; }
  .side-filter.f-ex svg { color: #16a34a; }
  .side-filter.f-ex2 svg { color: #a8a29e; }
  .side-filter input { flex: 1; border: none; outline: none; font-size: 13px; min-width: 0; background: transparent; color: #1c1917; }
  .side-filter input::placeholder { color: #c4c0bb; }

  /* 侧栏滚动列表 */
  .side-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 0 8px 12px;
  }

  /* ===== 内容搜索结果（紧凑） ===== */
  .cg-head {
    display: flex; align-items: center; gap: 7px;
    padding: 6px 6px 5px;
    cursor: pointer;
    border-radius: 7px;
  }
  .cg-head:hover { background: #f0efed; }
  .cg-head .chev { width: 13px; height: 13px; color: #a8a29e; flex-shrink: 0; transition: transform .15s; }
  .cg.collapsed .chev { transform: rotate(-90deg); }
  .cg-head .fi-icon { width: 15px; height: 15px; flex-shrink: 0; }
  .cg-head .fi-icon svg { width: 15px; height: 15px; }
  .cg-head .cg-name {
    flex: 1; min-width: 0;
    font-size: 12px; font-weight: 600; color: #44403c;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cg-head .cg-count {
    font-size: 10.5px; color: #a8a29e;
    background: #f0efed; padding: 0 6px; border-radius: 9px;
    flex-shrink: 0;
  }
  .cg-rows { overflow: hidden; }
  .cg.collapsed .cg-rows { display: none; }
  .cr-row {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 6px 4px 28px;
    border-radius: 6px; cursor: pointer;
  }
  .cr-row:hover { background: #f0efed; }
  .cr-row.active { background: #f0fdf4; }
  .cr-row .cr-ln {
    width: 22px; flex-shrink: 0; text-align: right;
    font-size: 10.5px; color: #c4c0bb;
  }
  .cr-row.active .cr-ln { color: #16a34a; }
  .cr-row .cr-code {
    flex: 1; min-width: 0;
    font-size: 11px; color: #78716c;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cr-row .cr-code mark { background: #fef08a; color: #422006; border-radius: 2px; padding: 0 1px; }
  .cr-row.active .cr-code mark { background: #bbf7d0; color: #14532d; }

  .side-note {
    font-size: 11px; color: #a8a29e;
    padding: 4px 8px 0;
  }

  /* ===== 主编辑区 ===== */
  .main-editor { flex: 1; display: flex; flex-direction: column; min-width: 0; background: #fff; }
  .me-tabs {
    height: 40px;
    background: #faf9f7;
    border-bottom: 1px solid #eceae7;
    display: flex; align-items: center; gap: 4px;
    padding: 0 12px;
  }
  .me-tab {
    height: 30px; display: flex; align-items: center; gap: 6px;
    padding: 0 11px;
    border-radius: 8px;
    font-size: 12.5px; color: #57534e;
  }
  .me-tab.active { background: #fff; color: #16a34a; box-shadow: inset 0 0 0 1px #eceae7; }
  .me-tab svg { width: 14px; height: 14px; }
  .me-tab .x { width: 12px; height: 12px; color: #a8a29e; }
  .me-content {
    flex: 1;
    padding: 26px 34px;
    overflow: auto;
    font-size: 13px;
    line-height: 1.85;
  }
  .me-line {
    display: flex; gap: 20px;
    padding: 0 8px;
    border-radius: 5px;
    white-space: pre;
  }
  .me-line .me-ln {
    width: 26px; text-align: right;
    color: #d6d3d1; font-size: 11.5px;
    user-select: none;
  }
  .me-line .me-code { color: #44403c; }
  .me-line .me-code mark {
    background: #fef08a; border-radius: 3px; padding: 0 1px;
  }
  .me-line.hit { background: #f0fdf4; }
  .me-line.hit .me-ln { color: #16a34a; }

  /* 状态栏 */
  .statusbar {
    height: 32px;
    background: #f5f5f4;
    border-top: 1px solid #eceae7;
    display: flex; align-items: center;
    padding: 0 12px; gap: 4px;
    font-size: 12px; color: #78716c;
  }
  .sb-item { display: flex; align-items: center; gap: 5px; height: 24px; padding: 0 7px; border-radius: 4px; }
  .sb-item svg { width: 13px; height: 13px; }
  .sb-item.clickable { cursor: pointer; }
  .sb-item.clickable:hover { background: #eceae7; }
  .sb-item.static { color: #a8a29e; cursor: default; }
  .sb-spacer { flex: 1; }

  /* Toast */
  #toast {
    position: fixed; left: 50%; bottom: 30px;
    transform: translateX(-50%) translateY(8px);
    background: #18181b; color: #fff;
    font-size: 12.5px; padding: 9px 16px;
    border-radius: 9px; opacity: 0;
    pointer-events: none;
    transition: opacity .18s, transform .18s;
    z-index: 60;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .section-label {
    max-width: 1320px; margin: 0 auto;
    padding: 26px 16px 0;
    font-size: 12px; color: #a8a29e; font-weight: 600
  }
</style>
</head>
<body>

<div class="section-label">全局搜索 · 可选择项目范围（固定 320px 侧边栏）</div>
<div class="window">
  <div class="body-row">
    <!-- 活动栏 -->
    <div class="activity">
      <button class="act-btn" title="文件">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
      </button>
      <button class="act-btn active" title="全局搜索">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </button>
      <button class="act-btn" title="版本控制">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" x2="6" y1="3" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg>
      </button>
      <button class="act-btn" title="中转站">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
      </button>
      <span class="spacer"></span>
      <button class="act-btn" title="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/></svg>
      </button>
    </div>

    <!-- 搜索侧边栏 -->
    <div class="search-sidebar">
      <div class="side-header">
        <span class="side-title">搜索</span>
        <button class="collapse-btn" title="折叠侧边栏">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
      </div>

      <!-- ===== 项目选择器（搜索范围） ===== -->
      <div class="project-wrap">
        <button class="project-btn" id="projectBtn">
          <svg class="pb-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
          <span class="pb-body">
            <span class="pb-name" id="pbName">Vessel</span>
            <span class="pb-path" id="pbPath">~/Projects/Vessel</span>
          </span>
          <svg class="pb-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="project-menu" id="projectMenu">
          <div class="pm-label">选择搜索项目</div>
          <div class="pm-item active" data-name="Vessel" data-path="~/Projects/Vessel">
            <svg class="pm-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
            <span class="pm-body">
              <span class="pm-name">Vessel</span>
              <span class="pm-path">~/Projects/Vessel</span>
            </span>
            <svg class="pm-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          </div>
          <div class="pm-item" data-name="AITaskflow" data-path="~/Projects/AITaskflow">
            <svg class="pm-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
            <span class="pm-body">
              <span class="pm-name">AITaskflow</span>
              <span class="pm-path">~/Projects/AITaskflow</span>
            </span>
            <svg class="pm-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          </div>
          <div class="pm-item" data-name="MyNotes" data-path="~/Documents/MyNotes">
            <svg class="pm-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
            <span class="pm-body">
              <span class="pm-name">MyNotes</span>
              <span class="pm-path">~/Documents/MyNotes</span>
            </span>
            <svg class="pm-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          </div>
          <div class="pm-item" data-name="flexnote" data-path="~/Documents/flexnote">
            <svg class="pm-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
            <span class="pm-body">
              <span class="pm-name">flexnote</span>
              <span class="pm-path">~/Documents/flexnote</span>
            </span>
            <svg class="pm-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          </div>
          <div class="pm-sep"></div>
          <div class="pm-action" id="pmOpen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.55 6a2 2 0 0 1-1.94 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.93a2 2 0 0 1 1.66.9l.82 1.2a2 2 0 0 0 1.66.9H18a2 2 0 0 1 2 2v2"/></svg>
            打开其他文件夹…
          </div>
        </div>
      </div>

      <!-- ===== 内容搜索 ===== -->
      <div class="side-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
