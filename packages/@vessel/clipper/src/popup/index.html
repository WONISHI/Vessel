<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vessel Clipper</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="clipper-container">
    <!-- 头部栏 -->
    <header class="header">
      <div class="brand">
        <div class="logo">V</div>
        <span class="title">Vessel 网页剪藏</span>
      </div>
      <div id="connection-status" class="status-badge checking">
        <span class="dot"></span>
        <span class="text">检测中...</span>
      </div>
    </header>

    <!-- 剪藏模式切换 -->
    <div class="tabs">
      <button class="tab-btn active" data-mode="article">📄 全文文章</button>
      <button class="tab-btn" data-mode="selection">✂️ 选中文字</button>
      <button class="tab-btn" data-mode="bookmark">🔖 网址书签</button>
    </div>

    <!-- 表单字段 -->
    <div class="form-body">
      <div class="field">
        <label for="clip-title">标题</label>
        <input type="text" id="clip-title" placeholder="文章或网页标题" />
      </div>

      <div class="field-row">
        <div class="field flex-1">
          <label for="clip-folder">保存目录</label>
          <input type="text" id="clip-folder" value="Clippings" placeholder="例如: Clippings" />
        </div>
        <div class="field flex-1">
          <label for="clip-tags">标签 (逗号分隔)</label>
          <input type="text" id="clip-tags" placeholder="例如: 前端, 学习" />
        </div>
      </div>

      <div class="field">
        <label for="clip-notes">备注与批注 (可选)</label>
        <textarea id="clip-notes" rows="2" placeholder="添加对此网页的个人见解或阅读笔记..."></textarea>
      </div>

      <!-- 内容折叠预览 -->
      <div class="preview-box">
        <button id="toggle-preview-btn" class="preview-toggle" type="button">
          <span>内容预览 (Markdown)</span>
          <span class="arrow">▼</span>
        </button>
        <pre id="preview-content" class="preview-content hidden"></pre>
      </div>
    </div>

    <!-- 底部操作区 -->
    <footer class="footer">
      <div id="message-bar" class="message-bar"></div>
      <div class="actions">
        <button id="copy-btn" class="btn btn-outline" title="复制 Markdown 到剪贴板">复制</button>
        <button id="download-btn" class="btn btn-outline" title="下载为 .md 文件">下载</button>
        <button id="save-btn" class="btn btn-primary">保存到 Vessel</button>
      </div>
    </footer>
  </div>

  <script type="module" src="index.js"></script>
</body>
</html>
