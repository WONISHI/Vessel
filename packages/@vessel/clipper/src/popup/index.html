<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vessel Clipper</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="clipper-container">
    <!-- 头部栏 -->
    <header class="header">
      <div class="brand">
        <img class="logo" src="../icons/icon48.png" alt="Vessel 剪藏" width="24" height="24" />
        <span class="title">Vessel 网页剪藏</span>
      </div>
      <div id="connection-status" class="status-badge checking">
        <span class="dot"></span>
        <span class="text">检测中...</span>
      </div>
    </header>

    <!-- 剪藏模式切换 -->
    <div class="tabs">
      <button class="tab-btn active" data-mode="article">📄 全文文章</button>
      <button class="tab-btn" data-mode="selection">✂️ 选中文字</button>
      <button class="tab-btn" data-mode="bookmark">🔖 网址书签</button>
    </div>

    <!-- 表单字段 -->
    <div class="field"><label for="clip-template">剪藏模板</label>
      <select id="clip-template"><option value="default">文章与阅读笔记</option><option value="quote">摘录卡片</option><option value="custom">自定义模板</option></select>
    </div>
    <div id="template-settings" hidden class="field"><label for="template-body">正文模板（自动附加 YAML 属性）</label>
      <textarea id="template-body" rows="5"></textarea>
      <small>变量：{{title}} {{url}} {{author}} {{site}} {{date}} {{content}} {{notes}} {{tags}} {{description}}</small>
    </div>
    <div class="form-body">
      <div class="field">
        <label for="clip-title">标题</label>
        <input type="text" id="clip-title" placeholder="文章或网页标题" />
      </div>

      <div class="field"><label for="clip-source">来源网址</label><input id="clip-source" type="text" readonly /></div>
      <div class="field-row"><div class="field flex-1"><label for="clip-author">作者</label><input id="clip-author" type="text" /></div><div class="field flex-1"><label for="clip-site">网站</label><input id="clip-site" type="text" /></div></div>
      <div class="field-row">
        <div class="field flex-1">
          <label for="clip-folder">保存目录</label>
          <input type="text" id="clip-folder" value="Clippings" placeholder="例如: Clippings" />
        </div>
        <div class="field flex-1">
          <label for="clip-tags">标签 (逗号分隔)</label>
          <input type="text" id="clip-tags" placeholder="例如: 前端, 学习" />
        </div>
      </div>

      <div class="field">
        <label for="clip-notes">备注与批注 (可选)</label>
        <textarea id="clip-notes" rows="2" placeholder="添加对此网页的个人见解或阅读笔记..."></textarea>
      </div>

      <!-- 内容折叠预览 -->
      <div class="preview-box">
        <button id="toggle-preview-btn" class="preview-toggle" type="button">
          <span>编辑 Markdown · <span id="content-count">0</span> 字符</span>
          <span class="arrow">▼</span>
        </button>
        <textarea id="preview-content" aria-label="Markdown 正文" class="preview-content hidden" rows="9"></textarea>
        <small id="edit-state" hidden>正文已手动修改，属性变化需重新生成正文后应用。</small>
        <button id="reset-content" class="preview-toggle" type="button">重新生成正文（覆盖手动修改）</button>
      </div>
    </div>

    <!-- 底部操作区 -->
    <footer class="footer">
      <div role="status" aria-live="polite" id="message-bar" class="message-bar"></div>
      <div class="actions">
        <button disabled id="copy-btn" class="btn btn-outline" data-title="复制 Markdown 到剪贴板">复制</button>
        <button disabled id="download-btn" class="btn btn-outline" data-title="下载为 .md 文件">下载</button>
        <button disabled id="save-btn" class="btn btn-primary">保存到 Vessel</button>
      </div>
    </footer>
  </div>

  <script type="module" src="index.js"></script>
</body>
</html>
