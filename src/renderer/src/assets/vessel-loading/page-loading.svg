<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <filter id="ps" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#44403c" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- 页面加载：白色文档卡片浮现，轮廓逐笔绘出，折角阴影渐入，文字行依次画出 -->
  <g>
    <!-- 轻微浮动 -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" keyTimes="0;0.5;1" dur="2.4s" repeatCount="indefinite"/>

      <!-- 纸底白卡（含投影），浮现 -->
      <rect x="62" y="22" width="76" height="90" rx="8" fill="#ffffff" filter="url(#ps)" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.14;0.9;1" dur="2.4s" repeatCount="indefinite"/>
      </rect>

      <!-- 纸张轮廓（周长 ≈ 318.3） -->
      <rect x="62" y="22" width="76" height="90" rx="8" fill="none"
            stroke="#d6d3d1" stroke-width="2"
            stroke-dasharray="318.3" stroke-dashoffset="318.3">
        <animate attributeName="stroke-dashoffset" values="318.3;0;0;318.3" keyTimes="0;0.26;0.9;1" dur="2.4s" repeatCount="indefinite"/>
      </rect>

      <!-- 折角（长度 ≈ 64.9）：描边逐笔 + 阴影填充渐入 -->
      <path d="M118 22 l20 20 l0 -12 a8 8 0 0 0 -8 -8 Z"
            fill="#e7e5e4" fill-opacity="0"
            stroke="#d6d3d1" stroke-width="2"
            stroke-dasharray="64.9" stroke-dashoffset="64.9">
        <animate attributeName="stroke-dashoffset" values="64.9;64.9;0;0;64.9" keyTimes="0;0.22;0.4;0.9;1" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="fill-opacity" values="0;0;1;1;0" keyTimes="0;0.3;0.44;0.9;1" dur="2.4s" repeatCount="indefinite"/>
      </path>

      <!-- 文字行，依次画出 -->
      <line x1="74" y1="48" x2="126" y2="48" stroke="#d6d3d1" stroke-width="3"
            stroke-dasharray="52" stroke-dashoffset="52">
        <animate attributeName="stroke-dashoffset" values="52;52;0;0;52" keyTimes="0;0.32;0.5;0.9;1" dur="2.4s" repeatCount="indefinite"/>
      </line>
      <line x1="74" y1="66" x2="126" y2="66" stroke="#d6d3d1" stroke-width="3"
            stroke-dasharray="52" stroke-dashoffset="52">
        <animate attributeName="stroke-dashoffset" values="52;52;0;0;52" keyTimes="0;0.4;0.58;0.9;1" dur="2.4s" repeatCount="indefinite"/>
      </line>
      <line x1="74" y1="84" x2="110" y2="84" stroke="#d6d3d1" stroke-width="3"
            stroke-dasharray="36" stroke-dashoffset="36">
        <animate attributeName="stroke-dashoffset" values="36;36;0;0;36" keyTimes="0;0.48;0.66;0.9;1" dur="2.4s" repeatCount="indefinite"/>
      </line>
      <line x1="74" y1="100" x2="100" y2="100" stroke="#d6d3d1" stroke-width="3"
            stroke-dasharray="26" stroke-dashoffset="26">
        <animate attributeName="stroke-dashoffset" values="26;26;0;0;26" keyTimes="0;0.56;0.74;0.9;1" dur="2.4s" repeatCount="indefinite"/>
      </line>
    </g>
  </g>

  <text x="100" y="136" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="500" fill="#78716c">正在载入笔记…</text>
</svg>
