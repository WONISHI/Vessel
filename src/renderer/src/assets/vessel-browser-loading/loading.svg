<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" width="200" height="200">
  <defs>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- 卡片整体：轻微上下浮动 -->
  <g filter="url(#cardShadow)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4; 0 0" keyTimes="0;0.5;1" dur="2.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    <rect x="45" y="48" width="110" height="104" rx="20" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  </g>

  <!-- 内容行：依次从左到右绘制 -->
  <g stroke-linecap="round" fill="none">
    <!-- 第一行：绿色标题 -->
    <line x1="65" y1="82" x2="100" y2="82" stroke="#16a34a" stroke-width="5" stroke-dasharray="35" stroke-dashoffset="35">
      <animate attributeName="stroke-dashoffset" values="35;0;0;35" keyTimes="0;0.18;0.68;1" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0;1" keyTimes="0;0.72;0.88;1" dur="2.6s" repeatCount="indefinite"/>
    </line>
    <!-- 第二行：灰色长文 -->
    <line x1="65" y1="102" x2="138" y2="102" stroke="#d6d3d1" stroke-width="4" stroke-dasharray="73" stroke-dashoffset="73">
      <animate attributeName="stroke-dashoffset" values="73;73;0;0;73" keyTimes="0;0.14;0.40;0.68;1" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;1;0;1" keyTimes="0;0.68;0.76;0.88;1" dur="2.6s" repeatCount="indefinite"/>
    </line>
    <!-- 第三行：灰色短文 -->
    <line x1="65" y1="120" x2="118" y2="120" stroke="#e7e5e4" stroke-width="4" stroke-dasharray="53" stroke-dashoffset="53">
      <animate attributeName="stroke-dashoffset" values="53;53;0;0;53" keyTimes="0;0.28;0.54;0.68;1" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;1;0;1" keyTimes="0;0.68;0.76;0.88;1" dur="2.6s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>
