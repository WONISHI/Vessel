<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      name="referrer"
      content="no-referrer"
    />

    <meta
      http-equiv="Content-Security-Policy"
      content="
    default-src 'self';
    frame-src 'self' blob: http://127.0.0.1:*;
    script-src 'self' blob: 'wasm-unsafe-eval';
    worker-src 'self' blob:;
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: blob: https: http: vessel-image:;
    font-src 'self' data: https://at.alicdn.com;
    connect-src vessel-image: 'self' blob: http://localhost:* ws://localhost:*;
  "
    />

    <title>Vessel</title>

    <!-- Boot splash: painted before the JS bundle loads; React replaces #root's content on mount. -->
    <style>
      html, body { margin: 0; height: 100%; background: #ffffff; }
      @media (prefers-color-scheme: dark) { html, body { background: #22272e; } }
      #root:empty { height: 100%; display: flex; align-items: center; justify-content: center; }
      #root:empty::after { content: ""; width: 22px; height: 22px; border-radius: 50%; border: 2px solid #d6d3d1; border-top-color: #327f73; animation: vessel-boot-spin 0.8s linear infinite; }
      @media (prefers-color-scheme: dark) { #root:empty::after { border-color: #444c56; border-top-color: #4fa394; } }
      @keyframes vessel-boot-spin { to { transform: rotate(360deg); } }
    </style>

    <link
      rel="shortcut icon"
      href="./src/assets/icon_32x32.png"
      type="image/x-icon"
    />
  </head>

  <body>
    <!-- Vditor otherwise fetches this sprite synchronously and injects it as inline JS,
         which our CSP blocks. Its loader recognizes this ID and skips injection. -->
    <script id="vditorIconScript" src="./vendor/vditor/dist/js/icons/ant.js"></script>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
